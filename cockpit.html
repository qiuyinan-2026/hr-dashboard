<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>聚光管理层数据驾驶舱</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0a1628 0%, #0f1f3d 50%, #0a1628 100%);
    color: #e2e8f0;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
  }
  /* 背景装饰 */
  body::before {
    content: ''; position: fixed; top: -50%; left: -50%;
    width: 200%; height: 200%;
    background: radial-gradient(circle at 30% 20%, rgba(56,189,248,0.06) 0%, transparent 50%),
                radial-gradient(circle at 70% 80%, rgba(168,85,247,0.06) 0%, transparent 50%);
    pointer-events: none; z-index: 0;
  }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 20px 48px;
    background: rgba(10, 22, 40, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(255,255,255,0.06);
    position: relative; z-index: 1;
  }
  .topbar-left { display: flex; align-items: center; gap: 16px; }
  .topbar-logo {
    width: 48px; height: 48px; border-radius: 14px;
    background: linear-gradient(135deg, #38bdf8, #a855f7);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 800; color: #fff;
    box-shadow: 0 4px 20px rgba(56,189,248,0.3);
  }
  .topbar-title {
    font-size: 24px; font-weight: 700;
    background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text; letter-spacing: 3px;
  }
  .topbar-subtitle { font-size: 12px; color: #475569; letter-spacing: 2px; margin-top: 3px; }
  .topbar-right {
    display: flex; align-items: center; gap: 12px;
    font-size: 13px; color: #64748b;
  }
  .pulse {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: #34d399; animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

  .main {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 20px 60px; position: relative; z-index: 1;
  }
  .hero-title {
    font-size: 36px; font-weight: 800; color: #f8fafc;
    margin-bottom: 10px; letter-spacing: 4px; text-align: center;
  }
  .hero-subtitle {
    font-size: 15px; color: #64748b; margin-bottom: 60px;
    letter-spacing: 2px; text-align: center;
  }

  .card-grid {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 28px; max-width: 1200px; width: 100%;
  }
  .sys-card {
    background: rgba(15, 31, 61, 0.5);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 24px; padding: 44px 28px 36px;
    text-align: center; cursor: pointer;
    transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    text-decoration: none; color: inherit;
    position: relative; overflow: hidden;
    backdrop-filter: blur(8px);
  }
  .sys-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 4px;
    background: linear-gradient(90deg, transparent, var(--card-color), transparent);
    opacity: 0; transition: opacity 0.3s;
  }
  .sys-card:hover {
    transform: translateY(-8px) scale(1.02);
    border-color: var(--card-color);
    box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 40px var(--card-glow);
  }
  .sys-card:hover::before { opacity: 1; }
  .card-icon {
    width: 80px; height: 80px; border-radius: 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 36px; margin: 0 auto 24px;
    background: var(--card-bg);
    transition: transform 0.3s;
  }
  .sys-card:hover .card-icon { transform: scale(1.1); }
  .card-name {
    font-size: 20px; font-weight: 700; color: #f1f5f9;
    margin-bottom: 10px; letter-spacing: 1px;
  }
  .card-desc {
    font-size: 13px; color: #64748b; line-height: 1.7;
    min-height: 60px;
  }
  .card-arrow {
    margin-top: 20px; font-size: 12px; color: var(--card-color);
    opacity: 0; transform: translateX(-10px);
    transition: all 0.3s; letter-spacing: 1px;
  }
  .sys-card:hover .card-arrow { opacity: 1; transform: translateX(0); }

  .sys-card.hr { --card-color: #38bdf8; --card-glow: rgba(56,189,248,0.15); --card-bg: linear-gradient(135deg, rgba(56,189,248,0.15), rgba(59,130,246,0.1)); }
  .sys-card.profit { --card-color: #f59e0b; --card-glow: rgba(245,158,11,0.15); --card-bg: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(239,68,68,0.1)); }
  .sys-card.finance { --card-color: #34d399; --card-glow: rgba(52,211,153,0.15); --card-bg: linear-gradient(135deg, rgba(52,211,153,0.15), rgba(16,185,129,0.1)); }
  .sys-card.project { --card-color: #a78bfa; --card-glow: rgba(167,139,250,0.15); --card-bg: linear-gradient(135deg, rgba(167,139,250,0.15), rgba(139,92,246,0.1)); }

  .footer {
    text-align: center; padding: 20px; font-size: 12px;
    color: #334155; letter-spacing: 1px; position: relative; z-index: 1;
  }

  @media (max-width: 1024px) {
    .card-grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width: 600px) {
    .card-grid { grid-template-columns: 1fr; }
    .topbar { padding: 14px 20px; }
    .topbar-title { font-size: 18px; letter-spacing: 1px; }
    .hero-title { font-size: 24px; }
    .topbar-right { display: none; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="topbar-left">
    <div class="topbar-logo">聚</div>
    <div>
      <div class="topbar-title">聚光管理层数据驾驶舱</div>
      <div class="topbar-subtitle">JUGUANG MANAGEMENT DATA COCKPIT</div>
    </div>
  </div>
  <div class="topbar-right">
    <span class="pulse"></span>数据实时更新中
  </div>
</div>

<div class="main">
  <div class="hero-title">管理层数据驾驶舱</div>
  <div class="hero-subtitle">一站式经营数据管理平台</div>

  <div class="card-grid">
    <a href="hr.html" class="sys-card hr">
      <div class="card-icon">👥</div>

      <div class="card-desc">薪资数据查询<br>个人收入查询<br>人力资源仪表盘</div>
      <div class="card-arrow">进入系统 →</div>
    </a>
    <a href="profit.html" class="sys-card profit">
      <div class="card-icon">📊</div>
      <div class="card-name">聚光利润核算系统</div>
      <div class="card-desc">项目经营分析看板<br>直播间平面图</div>
      <div class="card-arrow">进入系统 →</div>
    </a>
    <a href="finance.html" class="sys-card finance">
      <div class="card-icon">💰</div>
      <div class="card-name">聚光财务管理系统</div>
      <div class="card-desc">财务收入数据查询<br>经营数据仪表盘<br>应收款分析</div>
      <div class="card-arrow">进入系统 →</div>
    </a>
    <a href="https://juguangzb.feishuapp.com/app/app_17bytez7qwn/" target="_blank" class="sys-card project">
      <div class="card-icon">📁</div>
      <div class="card-name">聚光项目管理系统</div>
      <div class="card-desc">项目数据总览<br>项目进度跟踪<br>项目明细管理</div>
      <div class="card-arrow">进入系统 →</div>
    </a>
  </div>
</div>

<div class="footer">© 2026 聚光直播 · 管理层数据驾驶舱</div>

</body>
</html>
